name: Weekly update

on:
  schedule:
    # [테스트 기간] 매일 22:07 UTC = 매일 07:07 KST. 월요일 09:03 KST 알림(weekly-push.yml) 전에 끝난다.
    # 테스트가 끝나면 주 1회로 줄인다: 일요일 밤만 돌리려면 '7 22 * * 0' (= 월요일 07:07 KST)
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '조사만 하고 info.json 은 커밋하지 않기'
        type: boolean
        default: false
      model:
        description: '모델 (기본: 저장소 변수 CLAUDE_MODEL, 없으면 claude-opus-5-5)'
        type: choice
        default: default
        options: [default, claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
      effort:
        description: '생각 깊이 (기본: 저장소 변수 CLAUDE_EFFORT, 없으면 medium)'
        type: choice
        default: default
        options: [default, low, medium, high, xhigh, max]

permissions:
  contents: write # info.json 커밋
  actions: write  # 갱신 후 Pages 배포 workflow 를 실행

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: 공연·문화 정보 조사
        run: npm run update ${{ inputs.dry_run && '-- --dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 수동 실행 입력 > 저장소 변수 > 코드 기본값 순서. 'default' 는 비어 있는 것으로 취급한다.
          CLAUDE_MODEL: ${{ (inputs.model != 'default' && inputs.model) || vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ (inputs.effort != 'default' && inputs.effort) || vars.CLAUDE_EFFORT }}

      - name: 변경 사항 커밋
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- public/data/info.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/info.json
          git commit -m "chore: 주간 공연·문화 정보 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 으로 push 한 커밋은 다른 workflow 를 자동으로 깨우지 못하므로 배포를 직접 실행한다
      - name: Pages 배포
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
