name: Weekly push

on:
  schedule:
    # GitHub cron 은 UTC 기준. [테스트 기간] 매일 한국 시간 09:03 에 발송한다. (UTC 00:03)
    # 테스트가 끝나면 주 1회로 되돌린다: 마지막 칸(요일)을 지정.   분 시 일 월 요일(0=일 … 6=토)
    #   월요일 09:03 KST = '3 0 * * 1'      금요일 저녁 8시 KST = '3 11 * * 5'
    - cron: '3 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동으로도 보낼 수 있음

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notify
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
